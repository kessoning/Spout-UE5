<html lang="en" data-accent="cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpoutPlugin — UE5 Spout Sender / Receiver · Documentation</title>
  <meta name="description" content="GPU texture sharing between Unreal Engine 5 and external real-time applications such as TouchDesigner, through a D3D11-on-D3D12 bridge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/spout.css">
  <link rel="stylesheet" href="assets/spout-hero.css">
</head>
<body data-screen-label="SpoutPlugin Docs">

  <div id="bg-grid"></div>
  <canvas id="bg-canvas"></canvas>
  <div id="scroll-progress"></div>
  <div class="scrim"></div>

  <div class="shell">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="sb-head">
        <a class="sb-brand" href="#hero" style="text-decoration:none">
          <span class="sb-logo">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3 8 4-16 3 8h6"/></svg>
          </span>
          <span>
            <span class="sb-title">SpoutPlugin</span>
            <span class="sb-sub">v1.0.0 · UE5</span>
          </span>
        </a>
      </div>
      <div class="sb-search" id="cmdk-open" role="button" tabindex="0" aria-label="Open quick jump">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Quick jump</span>
        <span class="kbd">⌘K</span>
      </div>
      <nav class="sb-nav" id="sb-nav" aria-label="Documentation sections"></nav>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <div class="topbar">
        <button class="mobile-menu" aria-label="Open navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-pills">
          <span class="pill"><span class="dot"></span>v1.0.0</span>
          <span class="pill hide-sm"><span class="dot"></span>UE 5.3 - 5.8</span>
          <span class="pill warn hide-sm"><span class="dot"></span>DX12 required</span>
          <span class="pill warn"><span class="dot"></span>Windows only</span>
        </div>
        <div class="topbar-spacer"></div>
        <button class="topbar-cta" onclick="document.getElementById('install').scrollIntoView({behavior:'smooth'})">Get started</button>
      </div>

      <div class="wrap">
        <div id="doc"><!-- rendered by JS --></div>
      </div>
    </main>
  </div>

  <!-- ============ FLOATING CONTROLS ============ -->
  <button id="to-top" aria-label="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <button id="tweaks-toggle" aria-label="Open appearance tweaks" style="bottom:78px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
  </button>

  <div id="tweaks">
    <h4><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round"><path d="M4 4h7v16a3 3 0 0 1-6 0V4z"/><path d="M11 11l4-4 5 5-9 9"/></svg> Appearance</h4>
    <div class="tw-row">
      <div class="tw-label">Signal accent</div>
      <div class="tw-swatches">
        <button class="tw-sw" data-accent-opt="cyan" style="background:oklch(0.82 0.13 200)" title="Electric cyan" aria-label="Electric cyan"></button>
        <button class="tw-sw" data-accent-opt="acid" style="background:oklch(0.86 0.18 135)" title="Acid green" aria-label="Acid green"></button>
        <button class="tw-sw" data-accent-opt="violet" style="background:oklch(0.78 0.12 300)" title="Pale violet" aria-label="Pale violet"></button>
      </div>
    </div>
    <div class="tw-row">
      <div class="tw-label">Living background</div>
      <div class="tw-seg">
        <button data-bg-opt="on">On</button>
        <button data-bg-opt="off">Off</button>
      </div>
    </div>
  </div>

  <!-- ============ COMMAND PALETTE ============ -->
  <div class="cmdk-overlay" id="cmdk-overlay">
    <div class="cmdk" role="dialog" aria-label="Quick jump">
      <div class="cmdk-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="cmdk-input-el" type="text" placeholder="Jump to a section or API node..." autocomplete="off">
      </div>
      <div class="cmdk-list" id="cmdk-list"></div>
      <div class="cmdk-foot">
        <span>↑↓ navigate</span><span>↵ open</span><span>esc close</span>
      </div>
    </div>
  </div>

  <!-- thumbnail for bundler -->
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0c1014"/>
      <path d="M20 50h12l8 22 11-44 8 22h21" fill="none" stroke="#3ad8e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </template>

  <!-- ============ SCRIPTS ============ -->
  <script src="assets/spout-data.js"></script>
  <script src="assets/spout-icons.js"></script>
  <script src="assets/spout-components.js"></script>
  <script src="assets/spout-render-a.js"></script>
  <script src="assets/spout-render-b.js"></script>
  <script src="assets/spout-app.js"></script>
</body>
</html>
