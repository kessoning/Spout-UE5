[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; Spout SDK, resolved from the plugin root by SpoutPlugin.Build.cs:
;   ThirdParty/Spout/include             -> PrivateIncludePaths
;   ThirdParty/Spout/lib/amd64/Spout.lib -> PublicAdditionalLibraries
;   ThirdParty/Spout/lib/amd64/Spout.dll -> RuntimeDependencies
; BuildPlugin's default filter ships /Binaries/ThirdParty/... but not /ThirdParty/...
/ThirdParty/...

; Licensing. Every distributed archive must carry the project license and the consolidated
; third-party notice; build.ps1 verifies both are present inside each generated ZIP and fails
; the release if either is missing.
/LICENSE
/THIRD_PARTY_NOTICES.md

; Shipped documentation, so an unzipped plugin is self-describing: install steps, the five
; Spout.dll layouts, colour-space behaviour, supported formats and troubleshooting. Validated in
; every archive by build.ps1 for the same reason as the licensing files.
/README.md

; Explicit public documentation subset: only the Docs/ files listed here are packaged.
/Docs/BLUEPRINT_API.md
/Docs/LIMITATIONS.md
/Docs/RELEASE_READINESS.md
