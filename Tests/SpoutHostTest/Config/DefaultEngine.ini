; Release-validation host configuration.
;
; Every setting here exists to make an unattended run deterministic and identical on UE 5.3
; through UE 5.8. Nothing here is a recommendation for real projects.

[/Script/EngineSettings.GameMapsSettings]
; Both maps are engine content, present and identical on every engine in the supported matrix.
; Using engine maps rather than authored .umap assets keeps this entire host project reproducible
; from tracked text sources, so a fresh clone can run the validation pipeline with no binary
; assets to check in.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Engine.GameModeBase
ServerDefaultMap=/Engine/Maps/Entry
TransitionMap=

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; The plugin's interop bridge is D3D11-on-D3D12; pinning D3D12 keeps every row of the matrix on
; the path the plugin is actually built for instead of leaving it to per-machine defaults.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default
AudioSampleRate=48000

[/Script/Engine.RendererSettings]
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AntiAliasing=0

[/Script/Engine.Engine]
; Uncapped and unsmoothed: the performance harness measures frame cost, and a smoothed or
; fixed frame rate would measure the cap instead.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/MoviePlayer.MoviePlayerSettings]
bWaitForMoviesToComplete=False
bMoviesAreSkippable=True

[/Script/Engine.GameEngine]
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver")

[SystemSettings]
; Small deterministic window. The smoke test never draws anything meaningful, and the performance
; scenarios publish explicitly sized render targets rather than the back buffer, so the window size
; does not influence any recorded number.
r.setres=640x360w
r.VSync=0
