; Spout plugin for Unreal Engine 5 - https://github.com/kessoning/Spout-UE5

; Packaging configuration for the release-validation host.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=SpoutHostTest
ProjectID=6C4D5F2A4C1E4A7B9E2D3F5A8B1C0D4E
CompanyName=SpoutPlugin release validation
Description=Unattended host used to prove packaged SpoutPlugin builds start, load Spout.dll and survive a full stream lifecycle.

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
BlueprintNativizationMethod=Disabled
UsePakFile=True
bGenerateChunks=False
bBuildHttpChunkInstallData=False
bCompressed=True
bSkipEditorContent=True
; The two maps the smoke sequence travels between. The scripts also pass these explicitly to
; BuildCookRun with -map=, so a packaged host is never at the mercy of ini merge order.
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+MapsToCook=(FilePath="/Engine/Maps/Templates/Template_Default")
